/* Layout: one calm column of soft frosted "aura" cards (blurred color fields inside glass), floating pill dock, big light headings, dot-matrix timer. */
:root{
  --f-fa:'Doran FaNum','Vazirmatn',system-ui,sans-serif;
  --f-fa-body:'Vazirmatn','Doran FaNum',system-ui,sans-serif;
  --f-en:'Hubot Sans','Vazirmatn',system-ui,sans-serif;
  --bg:#f5ebe6; --b1:#f0c9cc; --b2:#e6d3e8; --b3:#f6dfc6;
  --fg:#47323a; --muted:#8c7479; --accent:#a85f66; --accent-ink:#fff;
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.74); --stroke:rgba(255,255,255,.78); --hi:rgba(255,255,255,.92);
  --line:rgba(71,50,58,.10); --shadow:0 14px 36px rgba(120,70,80,.14);
  --ss:34%; --sl:56%;
  --s0:hsl(350 var(--ss) var(--sl)); --s1:hsl(28 var(--ss) var(--sl)); --s2:hsl(46 var(--ss) var(--sl)); --s3:hsl(140 var(--ss) var(--sl));
  --s4:hsl(175 var(--ss) var(--sl)); --s5:hsl(205 var(--ss) var(--sl)); --s6:hsl(250 var(--ss) var(--sl)); --s7:hsl(295 var(--ss) var(--sl));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e;
  --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.10); --shadow:0 14px 36px rgba(0,0,0,.38); --sl:72%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e;
  --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.10); --shadow:0 14px 36px rgba(0,0,0,.38); --sl:72%; color-scheme:dark}
:root[data-palette="rose"]{--bg:#f5ebe6; --b1:#f0c9cc; --b2:#e6d3e8; --b3:#f6dfc6; --fg:#47323a; --muted:#8c7479; --accent:#a85f66; --accent-ink:#fff;
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.74); --stroke:rgba(255,255,255,.78); --hi:rgba(255,255,255,.92); --line:rgba(71,50,58,.10); --shadow:0 14px 36px rgba(120,70,80,.14); --sl:56%; color-scheme:light}
:root[data-palette="sage"]{--bg:#edf0e4; --b1:#cddcc2; --b2:#e3e6c6; --b3:#d3e4db; --fg:#2f3c2d; --muted:#6f7b69; --accent:#58774f; --accent-ink:#fff;
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.74); --stroke:rgba(255,255,255,.78); --hi:rgba(255,255,255,.92); --line:rgba(47,60,45,.10); --shadow:0 14px 36px rgba(70,90,60,.14); --sl:54%; color-scheme:light}
:root[data-palette="mist"]{--bg:#e9eff3; --b1:#c6d9e8; --b2:#dbd7ee; --b3:#cfe5e3; --fg:#2c3b4b; --muted:#6a7d8e; --accent:#4a7394; --accent-ink:#fff;
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.74); --stroke:rgba(255,255,255,.78); --hi:rgba(255,255,255,.92); --line:rgba(44,59,75,.10); --shadow:0 14px 36px rgba(60,90,120,.14); --sl:54%; color-scheme:light}
:root[data-palette="navy"]{--bg:#0f1a2e; --b1:#21406e; --b2:#2c3068; --b3:#174a5e; --fg:#ece6da; --muted:#9ba6ba; --accent:#d9b98a; --accent-ink:#1c2433;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --stroke:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22); --line:rgba(255,255,255,.10); --shadow:0 14px 36px rgba(0,0,0,.38); --sl:72%; color-scheme:dark}
:root[data-palette="wine"]{--bg:#240f19; --b1:#5e2038; --b2:#3e1a37; --b3:#57322f; --fg:#f2e4dd; --muted:#bb9ca2; --accent:#e2a99d; --accent-ink:#2a1015;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.15); --hi:rgba(255,255,255,.2); --line:rgba(255,255,255,.10); --shadow:0 14px 36px rgba(0,0,0,.4); --sl:72%; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);margin:0;font-size:15px;line-height:1.7;
  padding-block:22px 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
#app{font-family:var(--f-fa-body);--f-head:var(--f-fa)}
#app[lang="fa"][data-font="doran"]{font-family:var(--f-fa)}
#app[lang="en"]{font-family:var(--f-en);--f-head:var(--f-en);font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.field i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.85;animation:drift 28s ease-in-out infinite alternate}
.field i:nth-child(1){width:60vmax;height:60vmax;background:var(--b1);top:-20vmax;right:-15vmax}
.field i:nth-child(2){width:55vmax;height:55vmax;background:var(--b2);bottom:-22vmax;left:-18vmax;animation-delay:-9s}
.field i:nth-child(3){width:38vmax;height:38vmax;background:var(--b3);top:38%;right:20%;animation-delay:-16s;opacity:.6}
@keyframes drift{to{transform:translate3d(4vmax,3vmax,0) scale(1.08)}}

.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.wrap.in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);border-radius:30px}
.aura{position:relative;overflow:hidden;isolation:isolate}
.aura::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 46% at 22% 28%,var(--au1,color-mix(in srgb,var(--b1) 90%,transparent)),transparent 72%),radial-gradient(42% 52% at 82% 78%,var(--au2,color-mix(in srgb,var(--b2) 90%,transparent)),transparent 72%);
  filter:blur(14px);opacity:.95;animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{to{transform:translate3d(3%,-3%,0) scale(1.08)}}
.card{padding:18px 20px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;text-wrap:balance}
.muted{color:var(--muted)}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-inline:6px}
.top h1{font-size:40px;line-height:1.25;font-weight:300;letter-spacing:-.01em}
#app[lang="fa"] .top h1{font-weight:300;letter-spacing:0}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
.rbtn:active{transform:scale(.88)}
.rbtn svg{width:21px;height:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding-inline:16px;border-radius:99px;font-size:13.5px;
  background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:background .3s,color .3s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip .dot{width:9px;height:9px;border-radius:50%}
.count{font-weight:600}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0 8px;border-radius:99px;position:relative;transition:background .35s,color .35s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.day:active{transform:scale(.92)}
.day small{font-size:11.5px;color:var(--muted);transition:color .3s}
.day b{font-size:17px;font-weight:600;line-height:1.5}
.day em{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px;transition:background .3s}
.day.has em{background:var(--muted);opacity:.55}
.day.full em{background:var(--accent);opacity:1}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel small{color:inherit;opacity:.85}
.day.sel em{background:var(--accent-ink)}
.day.today:not(.sel) b{color:var(--accent)}

  const b=todayIso();S.reviews=S.reviews.filter(r=>r.f!==x.id);
  S.reviews.push({id:uid(),f:x.id,t:x.t,s:x.s,b:b,k:0,due:iso(addDays(parse(b),GAPS[0]))});
}
const dueReviews=d=>S.reviews.filter(r=>r.due===d||(d===todayIso()&&r.due<d)).sort((a,b)=>a.due<b.due?-1:1);
function doReview(id){
  const r=S.reviews.find(z=>z.id===id);if(!r)return;
  if(r.k>=GAPS.length-1){S.reviews=S.reviews.filter(z=>z!==r);toast(t('revDone'))}
  else{
    r.k++;let d=iso(addDays(parse(r.b),GAPS[r.k]));
    if(d<=todayIso())d=iso(addDays(parse(todayIso()),1));
    r.due=d;toast(t('nextRev',jf(parse(d),{day:'numeric',month:'long'})));
  }

}

const GLYPH={'0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110','2':'01110 10001 00001 00010 00100 01000 11111',
 '3':'11110 00001 00001 01110 00001 00001 11110','4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',

 '9':'01110 10001 10001 01111 00001 00010 01100'};
const GL={};for(const k in GLYPH)GL[k]=GLYPH[k].split(' ');
function dotsSvg(){
  /* 25 columns x 7 rows: d g d g : g d g d  (g = 1-col gap) */
  let c='';
  for(let col=0;col<25;col++)for(let row=0;row<7;row++){
    const co=(col===12&&(row===2||row===4))?' co':'';
    c+='<circle data-c="'+col+'" data-r="'+row+'" class="'+co.trim()+'" cx="'+(col*10+5)+'" cy="'+(row*10+5)+'" r="2.9"/>';
  }
  return '<svg class="dots" id="dots" viewBox="0 0 250 70" role="img" aria-label="timer">'+c+'</svg>';
}
function paintDots(txt){ /* txt like "25:00" */
  const dg=[txt[0],txt[1],txt[3],txt[4]], starts=[0,6,14,20], on=new Set();
  dg.forEach((ch,i)=>GL[ch].forEach((rowStr,row)=>{for(let x=0;x<5;x++)if(rowStr[x]==='1')on.add((starts[i]+x)+','+row)}));
  on.add('12,2');on.add('12,4');
  $$('#dots circle').forEach(c=>{c.classList.toggle('on',on.has(c.dataset.c+','+c.dataset.r))});
}
function ticksSvg(){

function viewStats(){
  const d=parse(selDay), ws=weekStart(d), tdy=todayIso(), L=S.lang;
  let cols='', totalDone=0, totalN=0, mins=0; const per={};
  const maxN=Math.max(1,...Array.from({length:7},(_,i)=>stat(iso(addDays(ws,i))).done));
  for(let i=0;i<7;i++){
    const k=iso(addDays(ws,i)), s=stat(k); totalDone+=s.done; totalN+=s.n; mins+=studyMin(k);
    const sm=S.study[k]||{}; for(const id in sm)per[id]=(per[id]||0)+sm[id];
    cols+='<div class="col"><span class="n">'+(s.done?num(s.done):'')+'</span><div class="trk"><i data-h="'+(s.done?Math.max(10,s.done/maxN*100):0)+'" style="height:0"></i></div><small>'+WD[L][i]+'</small></div>';
  }
  let streak=0, c=parse(tdy); if(!stat(iso(c)).done)c=addDays(c,-1);
  while(stat(iso(c)).done>0&&streak<400){streak++;c=addDays(c,-1)}
  const maxM=Math.max(1,...Object.values(per));
  const rows=S.subjects.filter(s=>per[s.id]).map(s=>'<div class="hrow" style="--c:var(--s'+(s.c%8)+')"><span class="nm">'+esc(subjName(s.id))+'</span><span class="bar"><i style="width:'+(per[s.id]/maxM*100)+'%"></i></span><span class="v">'+esc(fmtMin(per[s.id]))+'</span></div>').join('');
  const wr=jf(ws,{day:'numeric',month:'long'})+t('to')+jf(addDays(ws,6),{day:'numeric',month:'long'});
  return topHeader(t('sTitle'),wr)+
  '<div class="kpis"><div class="glass kpi aura" '+au('b1','b3')+'><b>'+num(totalDone)+'</b><small>'+t('doneTasks')+'</small></div><div class="glass kpi aura" '+au('b3','b2')+'><b>'+(totalN?num(Math.round(totalDone/totalN*100))+(L==='en'?'%':'٪'):'—')+'</b><small>'+t('ofPlan')+'</small></div><div class="glass kpi aura" '+au('b2','b1')+'><b>'+num(streak)+'</b><small>'+t('streak')+'</small></div></div>'+
  '<section class="glass card"><h3>'+t('perDay')+'</h3><div class="cols">'+cols+'</div></section>'+
  '<section class="glass card aura" '+au('b2','b3')+'><h3>'+t('studyWeek')+'</h3>'+(rows?'<div class="muted" style="font-size:13px;margin-top:2px">'+t('total')+esc(fmtMin(mins))+'</div>'+rows:'<p class="muted" style="margin:6px 0 0;font-size:14px">'+t('noStudy')+'</p>')+'</section>';
}

const TABS={today:'list',timer:'timer',mist:'note',stats:'chart'};
function render(anim){
  const v=$('#view');
  v.className='wrap'+(anim?' in':'');
  v.innerHTML=tab==='today'?viewToday():tab==='timer'?viewTimer():tab==='mist'?viewMist():viewStats();
  if(anim)[...v.children].forEach((el,i)=>el.style.setProperty('--i',i));
  $$('.tabs button').forEach(b=>{const k=b.dataset.tab;b.setAttribute('aria-selected',k===tab);b.innerHTML=ic(TABS[k])+t(k)});
  $('.tabs').setAttribute('aria-label',t('tabs'));
  const f=$('#fab');f.hidden=!(tab==='today'||tab==='mist');f.innerHTML=ic('plus',2.4)+'<span>'+(tab==='mist'?t('addMist'):t('addTask'))+'</span>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('.pg[data-to]').forEach(e=>e.style.strokeDashoffset=e.dataset.to);
    $$('.trk i[data-h]').forEach(e=>e.style.height=e.dataset.h+'%');
  }));
  if(tab==='timer')paintTimer();
  justId=null;
}

/* ---------- timer ---------- */
const T={mode:'f',remain:25*60,running:false,end:0,subj:null,iv:null};
T.subj=S.subjects[0]&&S.subjects[0].id;
const tTotal=()=>(T.mode==='f'?S.pomo.f:S.pomo.b)*60;
function resetTimer(){clearInterval(T.iv);T.running=false;T.remain=tTotal();paintTimer()}
function logStudy(min){
  if(min<1||!T.subj)return;
  const d=todayIso();const m=S.study[d]||(S.study[d]={});m[T.subj]=(m[T.subj]||0)+min;save();
}
function tick(){
  T.remain=Math.max(0,Math.round((T.end-Date.now())/1000));
  if(T.remain<=0){
    clearInterval(T.iv);T.running=false;
    if(T.mode==='f'){logStudy(S.pomo.f);toast(t('roundDone'));T.mode='b'}else{toast(t('breakDone'));T.mode='f'}
    T.remain=tTotal();
  }
  paintTimer();
}
function paintTimer(){
  if(!$('#dots'))return;
  const m=Math.floor(T.remain/60),s=T.remain%60;
  paintDots(pad(Math.min(m,99))+':'+pad(s));
  $('#tMode').textContent=T.mode==='f'?t('focus'):t('brk');
  const lit=Math.ceil(60*T.remain/tTotal());
  $$('#ticks .tk').forEach(l=>l.classList.toggle('on',+l.dataset.i<lit));
  $('#dial').classList.toggle('run',T.running);
  const mb=$('#tMain');mb.innerHTML=ic(T.running?'pause':'play',2.4);mb.setAttribute('aria-label',T.running?t('pause'):t('start'));
  const sub=$('#tSub');if(sub){const x=studyMin(todayIso());sub.textContent=x?t('tSub',fmtMin(x)):t('tSub0')}
}
function toggleTimer(){
  if(T.running){clearInterval(T.iv);T.running=false;T.remain=Math.max(0,Math.round((T.end-Date.now())/1000))}
  else{T.end=Date.now()+T.remain*1000;T.running=true;T.iv=setInterval(tick,500)}
  paintTimer();
}
function saveStudy(){
  if(T.mode!=='f'){resetTimer();return}
  const done=Math.floor((tTotal()-T.remain)/60);
  if(done<1){toast(t('noMin'));return}
  logStudy(done);toast(t('savedMin',num(done)));resetTimer();
}

/* ---------- sheets ---------- */
let sheetDrag=null;
function openSheet(html,bind){
  const w=$('#sheetWrap'),sh=$('#sheet');
  sh.className='sheet glass';sh.style.transform='';sh.style.opacity='';
  sh.innerHTML='<div class="grab" id="grab"><i></i></div>'+html;w.hidden=false;
  const g=$('#grab');
  g.addEventListener('pointerdown',e=>{sheetDrag={y:e.clientY,dy:0};g.setPointerCapture(e.pointerId);sh.style.animation='none'});
  g.addEventListener('pointermove',e=>{if(!sheetDrag)return;sheetDrag.dy=Math.max(0,e.clientY-sheetDrag.y);sh.style.transform='translateY('+sheetDrag.dy+'px)'});
  const end=()=>{if(!sheetDrag)return;const dy=sheetDrag.dy;sheetDrag=null;if(dy>90)closeSheet();else{sh.style.transition='transform .3s cubic-bezier(.2,.9,.25,1.05)';sh.style.transform='';setTimeout(()=>sh.style.transition='',320)}};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  if(bind)bind(sh);
  const f=$('#sheet input:not([type=hidden]),#sheet textarea');if(f&&matchMedia('(pointer:fine)').matches)f.focus();
}
function closeSheet(){
  const w=$('#sheetWrap'),sh=$('#sheet');if(w.hidden)return;
  sh.style.animation='none';sh.classList.add('closing');sh.style.transform='';
  setTimeout(()=>{w.hidden=true;sh.innerHTML='';sh.className='sheet glass'},260);
}
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});

const subjChips=(cur,attr)=>S.subjects.map(s=>'<button type="button" class="chip" '+attr+'="'+s.id+'" aria-pressed="'+(s.id===cur)+'"><i class="dot" style="background:var(--s'+(s.c%8)+')"></i>'+esc(subjName(s.id))+'</button>').join('');
const strip=s=>s.replace(/^[\s\-–•·*]+/,'').replace(/^[\d۰-۹]+\s*[\.\)\-]\s*/,'').trim();
const norm=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').toLowerCase();
const subjMatch=l=>S.subjects.find(s=>norm(l).includes(norm(s.n))||norm(l).includes(norm(subjName(s.id))));

function taskSheet(id){
  const tk=id?dayTasks(selDay).find(x=>x.id===id):null;
  let sj=tk?tk.s:(T.lastSubj&&subj(T.lastSubj)?T.lastSubj:S.subjects[0].id), multi=false, rvOn=tk?tk.r!==false:true;
  const dl=jf(parse(selDay),{weekday:'long',day:'numeric',month:'long'});
  openSheet(
   '<h2>'+(tk?t('editTask'):t('newTask'))+' <span class="muted" style="font-size:14px;font-weight:400">· '+esc(dl)+'</span></h2><form class="frm" id="tf">'+
   (tk?'':'<div class="seg" style="align-self:flex-start"><button type="button" data-m="one" aria-pressed="true">'+t('one')+'</button><button type="button" data-m="many" aria-pressed="false">'+t('multi')+'</button></div>')+
   '<div id="one" class="frm"><input class="inp" id="fT" placeholder="'+esc(t('taskPh'))+'" value="'+esc(tk?tk.t:'')+'" maxlength="140" autocomplete="off"><input class="inp" id="fA" placeholder="'+esc(t('amtPh'))+'" value="'+esc(tk?tk.a:'')+'" maxlength="40" autocomplete="off"></div>'+
   '<div id="many" class="frm" hidden><textarea class="inp" id="fM" placeholder="'+esc(t('multiPh'))+'"></textarea><span class="muted" style="font-size:12.5px">'+t('multiHint')+'</span></div>'+
   '<div><p class="lbl">'+t('subject')+'</p><div class="chips" id="fS">'+subjChips(sj,'data-sj')+'</div></div>'+
   '<div><button type="button" class="chip" id="fR" aria-pressed="'+rvOn+'">'+t('revToggle')+'</button></div>'+
   '<div id="noteBox"><textarea class="inp" id="fN" style="min-height:70px" placeholder="'+esc(t('notePh'))+'" maxlength="300">'+esc(tk?tk.n:'')+'</textarea></div>'+
   '<div class="acts"><button class="pill grow" type="submit">'+(tk?t('save'):t('add'))+'</button>'+(tk?'<button class="pill soft" type="button" id="fMove">'+t('forTom')+'</button><button class="pill danger" type="button" id="fDel">'+t('del')+'</button>':'')+'</div></form>',
  root=>{
    root.addEventListener('click',e=>{
      const c=e.target.closest('[data-sj]');if(c){sj=c.dataset.sj;T.lastSubj=sj;$$('#fS .chip',root).forEach(x=>x.setAttribute('aria-pressed',x.dataset.sj===sj))}
      const rb=e.target.closest('#fR');if(rb){rvOn=!rvOn;rb.setAttribute('aria-pressed',rvOn)}
      const m=e.target.closest('[data-m]');if(m){multi=m.dataset.m==='many';$$('[data-m]',root).forEach(x=>x.setAttribute('aria-pressed',x===m));$('#one',root).hidden=multi;$('#many',root).hidden=!multi;$('#noteBox',root).hidden=multi}
    });
    $('#tf',root).addEventListener('submit',e=>{
      e.preventDefault();
      if(tk){
        const v=$('#fT',root).value.trim();if(!v){$('#fT',root).focus();return}
        tk.t=v;tk.a=$('#fA',root).value.trim();tk.n=$('#fN',root).value.trim();tk.s=sj;tk.r=rvOn;delete tk.ex;
        if(!rvOn)S.reviews=S.reviews.filter(r=>r.f!==tk.id);else S.reviews.forEach(r=>{if(r.f===tk.id){r.t=tk.t;r.s=tk.s}});
      }else if(multi){
        const lines=$('#fM',root).value.split(/\n+/).map(strip).filter(Boolean);
        if(!lines.length){$('#fM',root).focus();return}
        lines.forEach(l=>{const hit=subjMatch(l);dayTasks(selDay).push({id:uid(),t:l,s:hit?hit.id:sj,a:'',n:'',done:false,r:rvOn})});
        toast(t('addedN',num(lines.length)));
      }else{
        const v=$('#fT',root).value.trim();if(!v){$('#fT',root).focus();return}
        dayTasks(selDay).push({id:uid(),t:v,s:sj,a:$('#fA',root).value.trim(),n:$('#fN',root).value.trim(),done:false,r:rvOn});
      }
      save();closeSheet();render(false);
    });
    const del=$('#fDel',root);if(del)del.addEventListener('click',()=>{S.tasks[selDay]=dayTasks(selDay).filter(x=>x.id!==id);save();closeSheet();render(false)});
    const mv=$('#fMove',root);if(mv)mv.addEventListener('click',()=>{moveTask(id,iso(addDays(parse(selDay),1)));closeSheet();render(false);toast(t('movedTom'))});
  });
}
function moveTask(id,to){
  const l=dayTasks(selDay),i=l.findIndex(x=>x.id===id);if(i<0)return;
  const x=l.splice(i,1)[0];x.done=false;dayTasks(to).push(x);save();
}

function mistSheet(id){
  const m=id?S.mist.find(x=>x.id===id):null;
  let sj=m?m.s:(T.lastSubj&&subj(T.lastSubj)?T.lastSubj:S.subjects[0].id), w=m?m.w:'learn';
  openSheet('<h2>'+(m?t('editMist'):t('newMist'))+'</h2><form class="frm" id="mf">'+
   '<input class="inp" id="mT" placeholder="'+esc(t('mTopicPh'))+'" value="'+esc(m?m.t:'')+'" maxlength="140" autocomplete="off">'+
   '<textarea class="inp" id="mN" style="min-height:90px" placeholder="'+esc(t('mNotePh'))+'" maxlength="400">'+esc(m?m.n:'')+'</textarea>'+
   '<div><p class="lbl">'+t('subject')+'</p><div class="chips" id="mS">'+subjChips(sj,'data-sj')+'</div></div>'+
   '<div><p class="lbl">'+t('why')+'</p><div class="chips" id="mW">'+RS.map(r=>'<button type="button" class="chip" data-w="'+r+'" aria-pressed="'+(r===w)+'">'+t(r)+'</button>').join('')+'</div></div>'+
   '<div class="acts"><button class="pill grow" type="submit">'+(m?t('save'):t('record'))+'</button>'+(m?'<button class="pill danger" type="button" id="mDel">'+t('del')+'</button>':'')+'</div></form>',
  root=>{
    root.addEventListener('click',e=>{
      const c=e.target.closest('[data-sj]');if(c){sj=c.dataset.sj;T.lastSubj=sj;$$('#mS .chip',root).forEach(x=>x.setAttribute('aria-pressed',x.dataset.sj===sj))}
      const r=e.target.closest('[data-w]');if(r){w=r.dataset.w;$$('#mW .chip',root).forEach(x=>x.setAttribute('aria-pressed',x.dataset.w===w))}
    });
    $('#mf',root).addEventListener('submit',e=>{
      e.preventDefault();const v=$('#mT',root).value.trim();if(!v){$('#mT',root).focus();return}
      if(m){m.t=v;m.n=$('#mN',root).value.trim();m.s=sj;m.w=w}
      else S.mist.push({id:uid(),t:v,n:$('#mN',root).value.trim(),s:sj,w:w,d:todayIso(),fx:false});
      save();closeSheet();render(false);
    });
    const del=$('#mDel',root);if(del)del.addEventListener('click',()=>{S.mist=S.mist.filter(x=>x.id!==id);save();closeSheet();render(false)});
  });
}

function settingsSheet(){
  const P=[['auto','linear-gradient(135deg,#f0c9cc 50%,#21406e 50%)'],['rose','linear-gradient(135deg,#f6dfc6,#e9b9bf)'],['sage','linear-gradient(135deg,#e3e6c6,#a9c49c)'],['mist','linear-gradient(135deg,#dbd7ee,#a9c6df)'],['navy','linear-gradient(135deg,#2a4a7c,#0f1a2e)'],['wine','linear-gradient(135deg,#6e2742,#240f19)']];
  const jn=jparts(new Date());const ex=S.exam?jparts(parse(S.exam)):{y:jn.y+1,m:4,d:1};
  const yrs=[jn.y,jn.y+1,jn.y+2], L=S.lang;
  openSheet('<h2>'+t('set')+'</h2><div class="frm" style="gap:20px">'+
   '<div class="set"><span>'+t('lang')+'</span><div class="seg" id="sLang" style="align-self:flex-start"><button data-l="fa" aria-pressed="'+(L==='fa')+'">فارسی</button><button data-l="en" aria-pressed="'+(L==='en')+'">English</button></div></div>'+
   '<div class="set"><span>'+t('theme')+'</span><div class="swatches" id="sSw">'+P.map(p=>'<button class="sw" data-p="'+p[0]+'" style="background:'+p[1]+'" aria-label="'+t('pal')[p[0]]+'" title="'+t('pal')[p[0]]+'" aria-pressed="'+(S.palette===p[0])+'"></button>').join('')+'</div></div>'+
   (L==='fa'?'<div class="set"><span>'+t('fontL')+'</span><div class="seg" id="sFont" style="align-self:flex-start"><button data-f="vazir" aria-pressed="'+(S.font!=='doran')+'">'+t('vazir')+'</button><button data-f="doran" aria-pressed="'+(S.font==='doran')+'">'+t('doran')+'</button></div></div>':'')+
   '<div class="set"><span>'+t('examDate')+'</span><div class="sel3"><select class="inp" id="xD" aria-label="'+t('dayL')+'">'+Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'"'+(ex.d===i+1?' selected':'')+'>'+num(i+1)+'</option>').join('')+'</select><select class="inp" id="xM" aria-label="'+t('monL')+'">'+MONTHS[L].map((m,i)=>'<option value="'+(i+1)+'"'+(ex.m===i+1?' selected':'')+'>'+m+'</option>').join('')+'</select><select class="inp" id="xY" aria-label="'+t('yrL')+'">'+yrs.map(y=>'<option value="'+y+'"'+(ex.y===y?' selected':'')+'>'+num(y)+'</option>').join('')+'</select></div><div class="acts"><button class="pill" id="xSave">'+t('saveDate')+'</button>'+(S.exam?'<button class="pill danger" id="xClr">'+t('rmDate')+'</button>':'')+'</div></div>'+
   '<div class="set"><span>'+t('subjects')+'</span><div class="chips" id="sSub">'+S.subjects.map(s=>'<span class="sbadge"><i style="width:9px;height:9px;border-radius:50%;background:var(--s'+(s.c%8)+')"></i>'+esc(subjName(s.id))+'<button data-rm="'+s.id+'" aria-label="'+t('del')+' '+esc(subjName(s.id))+'">'+ic('x',2.6)+'</button></span>').join('')+'</div><div style="display:flex;gap:8px"><input class="inp" id="sNew" placeholder="'+esc(t('newSubj'))+'" maxlength="20" autocomplete="off"><button class="pill" id="sAdd" style="height:50px">'+t('add')+'</button></div></div>'+
   '</div>',
  root=>{
    root.addEventListener('click',e=>{
      const l=e.target.closest('[data-l]');if(l&&l.dataset.l!==S.lang){S.lang=l.dataset.l;applyLook();save();render(false);settingsSheet();return}
      const p=e.target.closest('[data-p]');if(p){S.palette=p.dataset.p;applyLook();save();$$('#sSw .sw',root).forEach(x=>x.setAttribute('aria-pressed',x===p))}
      const f=e.target.closest('[data-f]');if(f){S.font=f.dataset.f;applyLook();save();$$('#sFont button',root).forEach(x=>x.setAttribute('aria-pressed',x===f))}
      const rm=e.target.closest('[data-rm]');if(rm){if(S.subjects.length<=1){toast(t('minOne'));return}S.subjects=S.subjects.filter(s=>s.id!==rm.dataset.rm);if(!subj(T.subj))T.subj=S.subjects[0].id;save();settingsSheet();render(false)}
    });
    $('#xSave',root).addEventListener('click',()=>{
      const g=jToG(+$('#xY',root).value,+$('#xM',root).value,+$('#xD',root).value);
      if(!g){toast(t('badDate'));return}
      S.exam=g;save();closeSheet();render(false);toast(t('examSaved'));
    });
    const clr=$('#xClr',root);if(clr)clr.addEventListener('click',()=>{S.exam=null;save();closeSheet();render(false)});
    const add=()=>{
      const v=$('#sNew',root).value.trim();if(!v)return;
      if(S.subjects.some(s=>s.n===v)){toast(t('exists'));return}
      const used=S.subjects.map(s=>s.c);let c=0;while(used.includes(c)&&c<7)c++;
      S.subjects.push({id:'s'+uid(),n:v,c:c});save();settingsSheet();render(false);
    };
    $('#sAdd',root).addEventListener('click',add);
    $('#sNew',root).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const ds=b.dataset;
  if(ds.tab){if(ds.tab!==tab){tab=ds.tab;render(true);window.scrollTo({top:0})}return}
  if(b.id==='fab'){tab==='mist'?mistSheet(null):taskSheet(null);return}
  if(ds.act==='add'){taskSheet(null);return}
  if(ds.act==='addm'){mistSheet(null);return}
  if(ds.act==='settings'){settingsSheet();return}
  if(ds.medit){mistSheet(ds.medit);return}
  if(ds.mfix){const m=S.mist.find(x=>x.id===ds.mfix);if(m){m.fx=!m.fx;justId=m.id;save();render(false);if(m.fx)toast(t('fixedT'))}return}
  if(ds.mf){MF.open=!MF.open;render(false);return}
  if(ds.ms){MF.s=ds.ms;render(false);return}
  if(ds.day){selDay=ds.day;render(true);return}
  if(ds.rev){doReview(ds.rev);return}
  if(ds.tog){
    const x=dayTasks(selDay).find(z=>z.id===ds.tog);
    if(x){x.done=!x.done;delete x.ex;justId=x.id;
      if(x.done){if(x.r!==false){scheduleReview(x);toast(t('tomRev'))}}
      else S.reviews=S.reviews.filter(r=>!(r.f===x.id&&r.k===0));
      save();render(false)}
    return}
  if(ds.edit){taskSheet(ds.edit);return}
  if(ds.act==='clearex'){for(const k in S.tasks)S.tasks[k]=S.tasks[k].filter(x=>!x.ex);save();render(false);return}
  if(ds.act==='carry'){
    const to=iso(addDays(parse(selDay),1)),keep=[],mv=[];
    dayTasks(selDay).forEach(x=>(x.done?keep:mv).push(x));
    S.tasks[selDay]=keep;mv.forEach(x=>dayTasks(to).push(x));save();render(false);toast(t('carried',num(mv.length)));return}
  if(ds.pre){const p=ds.pre.split(',').map(Number);S.pomo={f:p[0],b:p[1]};save();T.mode='f';resetTimer();$$('#tPre button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(ds.tsub){T.subj=ds.tsub;$$('#tSubj .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(ds.t==='toggle'){toggleTimer();return}
  if(ds.t==='reset'){resetTimer();return}
  if(ds.t==='save'){saveStudy();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.running)tick()});
render(true);
})();
</script>
